[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docpull"
version = "0.1.0"
description = "Pull SEC filings, indentures and credit agreements for a company into a folder"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
docpull = "docpull.cli:main"

[tool.setuptools]
packages = ["docpull"]
