<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Puller</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2024; --muted: #5f6b76; --border: #d9dee3;
    --accent: #1f5fbf; --accent-text: #ffffff; --warn-bg: #fff6e0; --warn: #7a5200;
    --bad-bg: #fdecec; --bad: #9b1c1c; --good: #1d6b3a; --log-bg: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --panel: #1d2126; --text: #e6e9ec; --muted: #9aa5b1; --border: #343a41;
      --accent: #6aa1ff; --accent-text: #0d1117; --warn-bg: #3a2f12; --warn: #f2cf7a;
      --bad-bg: #3d1d1d; --bad: #ff9c9c; --good: #7bd49c; --log-bg: #161a1e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  label:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  input[type=text], select { width: 100%; padding: 9px 11px; font: inherit; color: var(--text);
           background: var(--bg); border: 1px solid var(--border); border-radius: 7px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
  .check { font-weight: 400; display: flex; gap: 8px; align-items: center; margin: 0; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 7px; padding: 10px 18px; cursor: pointer;
           background: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border);
           font-weight: 500; padding: 6px 12px; margin: 4px 6px 0 0; text-align: left; }
  .actions { margin-top: 20px; display: flex; gap: 12px; align-items: center; }
  #status { font-weight: 600; }
  #log { background: var(--log-bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px;
         font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; height: 220px; overflow: auto;
         white-space: pre-wrap; margin-top: 10px; }
  .msg { border-radius: 7px; padding: 10px 12px; margin-top: 10px; }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .bad { background: var(--bad-bg); color: var(--bad); }
  .good { color: var(--good); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n { text-align: right; width: 60px; }
  h2 { font-size: 17px; margin: 18px 0 4px; }
  h2:first-child { margin-top: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Document Puller</h1>
  <p class="sub">Pulls SEC filings, indentures, credit agreements, transcripts and presentations for a company into one folder.</p>

  <form id="form" class="panel">
    <label for="company">Company <span class="hint">US ticker, company name or SEC CIK (e.g. CVNA, Teck Resources, Dye &amp; Durham)</span></label>
    <input type="text" id="company" required autocomplete="off">

    <label for="site">Investor website <span class="hint">Optional. Needed for companies not on EDGAR, e.g. Canada-only listings</span></label>
    <input type="text" id="site" placeholder="https://company.com/investors/" autocomplete="off">

    <label for="years">How far back</label>
    <select id="years">
      <option value="1">1 year</option><option value="2">2 years</option>
      <option value="3" selected>3 years</option><option value="5">5 years</option>
      <option value="10">10 years</option>
    </select>

    <div class="row">
      <label class="check"><input type="checkbox" id="debt" checked> Indentures &amp; credit agreements</label>
      <label class="check"><input type="checkbox" id="earnings" checked> Earnings releases</label>
    </div>

    <div id="ua-wrap" class="hidden">
      <label for="ua">Your name and work email <span class="hint">The SEC requires downloaders to identify themselves. Saved in this browser.</span></label>
      <input type="text" id="ua" placeholder="Jane Smith jane@company.com" autocomplete="off">
    </div>

    <div class="actions">
      <button type="submit" id="run">Pull documents</button>
      <span id="form-error" class="hint"></span>
    </div>
  </form>

  <section id="progress" class="panel hidden">
    <div id="status">Starting…</div>
    <div id="choices"></div>
    <div id="log" class="hidden" aria-live="polite"></div>
  </section>

  <section id="results" class="panel hidden"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let needsUA = false;

function storeGet(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

fetch("/api/config").then(r => r.json()).then(c => {
  needsUA = c.needs_user_agent;
  $("ua-wrap").classList.toggle("hidden", !needsUA);
  $("ua").value = storeGet("docpull-ua");
});

$("form").addEventListener("submit", e => { e.preventDefault(); start(); });

async function start() {
  $("form-error").textContent = "";
  const body = {
    company: $("company").value.trim(), site: $("site").value.trim(),
    years: Number($("years").value), debt: $("debt").checked, earnings: $("earnings").checked,
    user_agent: $("ua").value.trim(),
  };
  if (needsUA) storeSet("docpull-ua", body.user_agent);
  const r = await fetch("/api/run", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) { $("form-error").textContent = j.error; return; }
  $("run").disabled = true;
  $("progress").classList.remove("hidden");
  $("results").classList.add("hidden");
  $("choices").innerHTML = "";
  $("log").textContent = "";
  $("log").classList.add("hidden");
  $("status").textContent = "Working… this usually takes 1–3 minutes.";
  poll(j.id, 0);
}

async function poll(id, since) {
  let j;
  try { j = await (await fetch(`/api/status/${id}?since=${since}`)).json(); }
  catch { $("status").textContent = "Lost contact with docpull. Is it still running?"; $("run").disabled = false; return; }
  if (j.log.length) {
    const log = $("log");
    log.classList.remove("hidden");
    log.textContent += j.log.join("\n") + "\n";
    log.scrollTop = log.scrollHeight;
  }
  if (j.state === "queued" || j.state === "running") return setTimeout(() => poll(id, j.next), 1000);
  $("run").disabled = false;
  if (j.state === "error") {
    $("status").innerHTML = `<div class="msg bad">${esc(j.error)}</div>`;
  } else if (j.state === "choose") {
    $("status").textContent = "Several companies match. Pick one:";
    $("choices").innerHTML = j.candidates.map(([cik, name]) =>
      `<button class="secondary" data-cik="${cik}">${esc(name)} <span class="hint">CIK ${cik}</span></button>`).join("");
    $("choices").querySelectorAll("button").forEach(b => b.onclick = () => { $("company").value = b.dataset.cik; start(); });
  } else {
    $("status").innerHTML = `<span class="good">Finished.</span>`;
    showResults(id, j.result);
  }
}

function showResults(id, r) {
  const total = r.counts.reduce((a, [, n]) => a + n, 0);
  let h = `<h2>${esc(r.company)}</h2><p>${total} documents found.</p>`;
  h += `<div class="actions" style="margin-top:4px"><a href="/api/download/${id}"><button type="button">Download zip</button></a></div>`;
  if (r.counts.length) {
    h += `<table><tr><th>Folder</th><th class="n">Files</th></tr>` +
         r.counts.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${n}</td></tr>`).join("") + `</table>`;
  }
  if (r.failed.length) h += `<div class="msg bad">${r.failed.length} downloads failed: ${r.failed.map(esc).join(", ")}</div>`;
  r.warnings.forEach(w => h += `<div class="msg warn">${esc(w)}</div>`);
  if (r.notes.length) h += `<ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
  if (r.missing.length) {
    h += `<h2>Not found: check SEDAR+</h2><p class="hint">Listed as material contracts in the company's AIF but not found on EDGAR or its website.</p>`;
    h += `<table><tr><th>Type</th><th>Document</th></tr>` +
         r.missing.map(m => `<tr><td>${esc(m.category)}</td><td>${esc(m.document)}</td></tr>`).join("") + `</table>`;
  }
  $("results").innerHTML = h;
  $("results").classList.remove("hidden");
}
</script>
</body>
</html>
